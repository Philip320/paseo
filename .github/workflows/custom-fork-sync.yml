name: Sync custom fork

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-fork-sync
  cancel-in-progress: false

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  sync:
    if: github.repository == 'Philip320/paseo'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: custom
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Merge latest upstream without rewriting custom history
        id: upstream
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch https://github.com/getpaseo/paseo.git main
          echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git merge --no-edit FETCH_HEAD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci --no-audit --no-fund
      - name: Build server stack
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build:server
      - name: Check server types and repository lint
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm run typecheck:server
          npm run lint
      - name: Install Claude CLI for its version probe
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm install --global @anthropic-ai/claude-code@2.1.304 --no-audit --no-fund
      - name: Verify custom bug regressions
        if: steps.upstream.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: >-
          npm exec --workspace=@getpaseo/server -- vitest run
          src/server/agent/providers/claude/agent.test.ts
          src/server/agent/providers/claude/agent.history-load.test.ts
          scripts/supervisor.readiness.test.ts --bail=1
      - name: Publish verified custom branch and upstream mirror
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          git push origin HEAD:refs/heads/custom
          git push origin "$UPSTREAM_SHA":refs/heads/main
